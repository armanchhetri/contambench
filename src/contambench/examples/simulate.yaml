# Offline run with synthetic latencies. No endpoint and no GPU are needed.
# It exercises the harness and the scorer; its numbers are not measurements.
#   contam-bench run --config examples/simulate.yaml
#   contam-bench score contambench-results/raw/<run_id>
name: simulate_demo
simulate: true
attack_model: meta-llama/Llama-3.2-3B-Instruct   # resolves the D1 suite in the fetched record
workload_size: 50
contamination_ratio: [0.0, 0.10]
num_clients: 4
arrival_rate: [1.0]
arrival_model: poisson
requests_per_client: 10
num_trials: 2
max_tokens: 256  # short outputs keep the simulation to about a minute
temperature: 0.7
auto_slo: true
seed: 23
