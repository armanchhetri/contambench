# Step 2: contamination sweep at the calibrated operating points.
# Replace arrival_rate with the rates printed by `contam-bench calibrate`.
#   contam-bench run --config examples/sweep.yaml --endpoint http://HOST:8000
#   contam-bench score contambench-results/raw/<run_id>
name: contamination_sweep
backend: openai
attack_model: meta-llama/Llama-3.2-3B-Instruct
workload_size: 50
contamination_ratio: [0.0, 0.02, 0.05, 0.10, 0.15]
num_clients: 50
arrival_rate: [0.16, 0.23, 0.27]
arrival_model: poisson
requests_per_client: 20
num_trials: 3
max_tokens: 4096
temperature: 0.7
timeout_s: 600
config_cooldown_s: 20
auto_slo: true
seed: 23
