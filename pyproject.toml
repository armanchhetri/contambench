[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "contambench"
version = "0.2.0"
description = "Stressor suites, labeled contaminated workloads, and reference measurements for testing LLM serving"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/contambench/gen/loopllm/LICENSE"]
authors = [
    { name = "Arman Chhetri", email = "ac7240@rit.edu" },
    { name = "Yinxi Liu", email = "yxlics@rit.edu" },
]
keywords = ["llm", "serving", "vllm", "stress testing", "benchmark", "dataset"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "scipy>=1.10",
    "pyyaml>=6",
    "requests>=2.31",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]
# Stressor generation (`contam-bench generate`): only what the LoopLLM and Engorgio paths import.
gen = [
    "torch>=2.8,<2.9",
    "transformers>=4.57,<5",
    "accelerate>=1.10",
    "bitsandbytes>=0.48.1; sys_platform == 'linux' or sys_platform == 'win32'",
    "pydantic>=2.7",
    "datasets>=4.2",
    "antropy>=0.1.6",
    "tqdm>=4.66",
    "sentencepiece>=0.2",
]

[project.scripts]
contam-bench = "contambench.cli:main"

[project.urls]
Homepage = "https://contambench.pages.dev"
Dataset = "https://doi.org/10.5281/zenodo.23605512"
Source = "https://github.com/armanchhetri/contambench"

[tool.hatch.build.targets.wheel]
packages = ["src/contambench"]

[tool.hatch.build.targets.sdist]
include = ["src/contambench", "tests", "scripts", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
